name: FastBite Android Multi-Flavor Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APKs for All Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Project
        run: npm run build

      - name: Configure Capacitor and Android
        run: |
          npm install -D @capacitor/cli
          npm install @capacitor/core @capacitor/android @capacitor/splash-screen

          # Create/replace Capacitor config with official SplashScreen settings.
          cat > capacitor.config.ts <<'EOF'
          import type { CapacitorConfig } from '@capacitor/cli';

          const config: CapacitorConfig = {
            appId: 'com.fastbite.customer.app',
            appName: 'FastBite Food Delivery',
            webDir: 'dist',

            plugins: {
              SplashScreen: {
                launchAutoHide: true,
                launchShowDuration: 0,
                backgroundColor: '#09090B',
                showSpinner: false
              }
            }
          };

          export default config;
          EOF

          echo "Capacitor config:"
          cat capacitor.config.ts

          # Create native Android project.
          npx cap add android

          # Copy React build and synchronize plugins/config.
          rm -rf android/app/src/main/assets/public
          npx cap copy android
          npx cap sync android

          # --------------------------------------------------------
          # Android Manifest
          # --------------------------------------------------------
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST_FILE" ]; then
            sed -i 's/android:label="@string\/app_name"/android:label="${appName}"/g' "$MANIFEST_FILE"
            sed -i 's/android:label="@string\/title_activity_main"/android:label="${appName}"/g' "$MANIFEST_FILE"

            for PERM in INTERNET ACCESS_NETWORK_STATE ACCESS_FINE_LOCATION ACCESS_COARSE_LOCATION CALL_PHONE CAMERA VIBRATE POST_NOTIFICATIONS READ_EXTERNAL_STORAGE READ_MEDIA_IMAGES; do
              if ! grep -q "android.permission.$PERM" "$MANIFEST_FILE"; then
                sed -i "/<application/i \    <uses-permission android:name=\"android.permission.$PERM\" \/>" "$MANIFEST_FILE"
              fi
            done
          fi

          # --------------------------------------------------------
          # Flavor directories
          # --------------------------------------------------------
          for FLAVOR in customer kitchen rider admin; do
            mkdir -p "android/app/src/$FLAVOR/res/values"
          done

          printf '%s\n' \
            '<resources>' \
            '    <string name="app_name">FB Delivery</string>' \
            '    <string name="title_activity_main">FB Delivery</string>' \
            '</resources>' \
            > android/app/src/customer/res/values/strings.xml

          printf '%s\n' \
            '<resources>' \
            '    <string name="app_name">FB Kitchen</string>' \
            '    <string name="title_activity_main">FB Kitchen</string>' \
            '</resources>' \
            > android/app/src/kitchen/res/values/strings.xml

          printf '%s\n' \
            '<resources>' \
            '    <string name="app_name">FB Rider</string>' \
            '    <string name="title_activity_main">FB Rider</string>' \
            '</resources>' \
            > android/app/src/rider/res/values/strings.xml

          printf '%s\n' \
            '<resources>' \
            '    <string name="app_name">FB Manager</string>' \
            '    <string name="title_activity_main">FB Manager</string>' \
            '</resources>' \
            > android/app/src/admin/res/values/strings.xml

          # --------------------------------------------------------
          # App launcher icons
          # --------------------------------------------------------
          rm -rf android/app/src/main/res/mipmap-*/ic_launcher*
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*

          npm install sharp

          node -e '
          const fs = require("fs");
          const path = require("path");
          const sharp = require("sharp");

          const apps = ["customer", "kitchen", "rider", "admin"];
          const densities = {
            mdpi: 48,
            hdpi: 72,
            xhdpi: 96,
            xxhdpi: 144,
            xxxhdpi: 192
          };

          async function generateIcons() {
            for (const flavor of apps) {
              const svgPath = `src/assets/icons/${flavor}.svg`;

              if (!fs.existsSync(svgPath)) {
                console.error(`SVG icon not found at ${svgPath}`);
                continue;
              }

              const buffer = Buffer.from(fs.readFileSync(svgPath, "utf8"));

              for (const [density, size] of Object.entries(densities)) {
                const dir = `android/app/src/${flavor}/res/mipmap-${density}`;
                fs.mkdirSync(dir, { recursive: true });

                await sharp(buffer)
                  .resize(size, size)
                  .png()
                  .toFile(path.join(dir, "ic_launcher.png"));

                await sharp(buffer)
                  .resize(size, size)
                  .png()
                  .toFile(path.join(dir, "ic_launcher_round.png"));
              }
            }
          }

          generateIcons().catch(error => {
            console.error(error);
            process.exit(1);
          });
          '

          # --------------------------------------------------------
          # Product flavors
          # --------------------------------------------------------
          GRADLE_FILE="android/app/build.gradle"

          if [ -f "$GRADLE_FILE" ]; then
            if ! grep -q "flavorDimensions" "$GRADLE_FILE"; then
              sed -i '/defaultConfig {/i \    flavorDimensions "default"' "$GRADLE_FILE"
            fi

            if ! grep -q "productFlavors" "$GRADLE_FILE"; then
              sed -i '/buildTypes {/i\
              productFlavors {\
                  customer {\
                      dimension "default"\
                      applicationId "com.fastbite.customer.app"\
                      resValue "string", "app_name", "FB Delivery"\
                      resValue "string", "title_activity_main", "FB Delivery"\
                      manifestPlaceholders = [appName: "FB Delivery"]\
                  }\
                  kitchen {\
                      dimension "default"\
                      applicationId "com.fastbite.kitchen.kds"\
                      resValue "string", "app_name", "FB Kitchen"\
                      resValue "string", "title_activity_main", "FB Kitchen"\
                      manifestPlaceholders = [appName: "FB Kitchen"]\
                  }\
                  rider {\
                      dimension "default"\
                      applicationId "com.fastbite.rider.partner"\
                      resValue "string", "app_name", "FB Rider"\
                      resValue "string", "title_activity_main", "FB Rider"\
                      manifestPlaceholders = [appName: "FB Rider"]\
                  }\
                  admin {\
                      dimension "default"\
                      applicationId "com.fastbite.admin.manager"\
                      resValue "string", "app_name", "FB Manager"\
                      resValue "string", "title_activity_main", "FB Manager"\
                      manifestPlaceholders = [appName: "FB Manager"]\
                  }\
              }' "$GRADLE_FILE"
            fi
          fi

      - name: Build Android APK with Gradle
        run: |
          if [ ! -d "android" ]; then
            echo "Error: android directory does not exist."
            exit 1
          fi

          cd android

          if [ ! -f "settings.gradle" ]; then
            printf '%s\n' \
              "include ':app'" \
              "if (file('capacitor-cordova-android-plugins').exists()) {" \
              "    include ':capacitor-cordova-android-plugins'" \
              "    project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins')" \
              "}" \
              "def capacitorSettings = file('capacitor.settings.gradle')" \
              "if (capacitorSettings.exists()) {" \
              "    apply from: capacitorSettings" \
              "}" \
              > settings.gradle
          fi

          if [ ! -f "variables.gradle" ]; then
            printf '%s\n' \
              "ext {" \
              "    minSdkVersion = 22" \
              "    compileSdkVersion = 36" \
              "    targetSdkVersion = 35" \
              "    androidxActivityVersion = '1.8.0'" \
              "    androidxAppCompatVersion = '1.6.1'" \
              "    androidxCoordinatorLayoutVersion = '1.2.0'" \
              "    androidxCoreVersion = '1.12.0'" \
              "    androidxFragmentVersion = '1.6.2'" \
              "    coreSplashScreenVersion = '1.0.1'" \
              "    androidxWebkitVersion = '1.9.0'" \
              "    junitVersion = '4.13.2'" \
              "    androidxJunitVersion = '1.1.5'" \
              "    androidxEspressoCoreVersion = '3.5.1'" \
              "    cordovaAndroidVersion = '10.1.1'" \
              "}" \
              > variables.gradle
          fi

          find . -name "*.gradle" -exec sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/g' {} +
          find . -name "*.gradle" -exec sed -i 's/compileSdkVersion 35/compileSdkVersion 36/g' {} +
          find . -name "*.gradle" -exec sed -i 's/compileSdk 35/compileSdk 36/g' {} +
          find . -name "*.gradle" -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +

          if ! grep -q "resolutionStrategy" build.gradle; then
            printf '%s\n' \
              "" \
              "allprojects {" \
              "    configurations.all {" \
              "        resolutionStrategy {" \
              "            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'" \
              "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'" \
              "            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'" \
              "        }" \
              "    }" \
              "}" \
              >> build.gradle
          fi

          rm -rf gradle/wrapper/gradle-wrapper.jar
          gradle wrapper --gradle-version 8.13
          chmod +x gradlew

          ./gradlew clean assembleDebug --stacktrace

      - name: Upload All APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastBite-All-4-Flavor-APKs
          path: android/app/build/outputs/apk/*/debug/*.apk
