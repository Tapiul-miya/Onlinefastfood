name: FastBite Android Multi-Flavor Build

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:


jobs:

  build-apk:

    name: Build Android Debug APKs for All Apps

    runs-on: ubuntu-latest


    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Code
        uses: actions/checkout@v4


      # ============================================================
      # NODE.JS
      # ============================================================

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22


      # ============================================================
      # JAVA
      # ============================================================

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'


      # ============================================================
      # GRADLE
      # ============================================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'


      # ============================================================
      # INSTALL NPM DEPENDENCIES
      # ============================================================

      - name: Install NPM Dependencies
        run: npm ci || npm install


      # ============================================================
      # BUILD REACT / WEB PROJECT
      # ============================================================

      - name: Build Web Project
        run: npm run build


      # ============================================================
      # CAPACITOR ANDROID
      # ============================================================

      - name: Add / Sync Capacitor Android
        run: |

          echo "Installing Capacitor..."

          npm install -D @capacitor/cli
          npm install @capacitor/core @capacitor/android


          # --------------------------------------------------------
          # Initialize Capacitor if config does not exist
          # --------------------------------------------------------

          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then

            echo "Initializing Capacitor..."

            npx cap init \
              "FastBite Food Delivery" \
              "com.fastbite.customer.app" \
              --web-dir dist

          fi


          # --------------------------------------------------------
          # Create Android project
          # --------------------------------------------------------

          echo "Creating Android project..."

          npx cap add android


          # --------------------------------------------------------
          # Remove stale web assets
          # --------------------------------------------------------

          echo "Removing stale assets..."

          rm -rf android/app/src/main/assets/public


          # --------------------------------------------------------
          # Copy web files
          # --------------------------------------------------------

          npx cap copy android


          # --------------------------------------------------------
          # Sync Capacitor
          # --------------------------------------------------------

          npx cap sync android


          # ========================================================
          # ANDROID MANIFEST
          # ========================================================

          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          if [ -f "$MANIFEST_FILE" ]; then

            echo "Updating AndroidManifest.xml..."


            # ------------------------------------------------------
            # Flavor application label
            # ------------------------------------------------------

            sed -i \
              's/android:label="@string\/app_name"/android:label="${appName}"/g' \
              "$MANIFEST_FILE"


            sed -i \
              's/android:label="@string\/title_activity_main"/android:label="${appName}"/g' \
              "$MANIFEST_FILE"


            # ------------------------------------------------------
            # Permissions
            # ------------------------------------------------------

            for PERM in \
              "INTERNET" \
              "ACCESS_NETWORK_STATE" \
              "ACCESS_FINE_LOCATION" \
              "ACCESS_COARSE_LOCATION" \
              "CALL_PHONE" \
              "CAMERA" \
              "VIBRATE" \
              "POST_NOTIFICATIONS" \
              "READ_EXTERNAL_STORAGE" \
              "READ_MEDIA_IMAGES"
            do

              if ! grep -q "android.permission.$PERM" "$MANIFEST_FILE"; then

                sed -i \
                  "/<application/i \    <uses-permission android:name=\"android.permission.$PERM\" \/>" \
                  "$MANIFEST_FILE"

              fi

            done


            echo "Permissions injected successfully!"

          fi


          # ========================================================
          # REMOVE DEFAULT CAPACITOR LAUNCHER ICONS
          # ========================================================

          echo "Cleaning default Capacitor launcher icons..."

          rm -rf android/app/src/main/res/mipmap-*/ic_launcher*
          rm -rf android/app/src/main/res/mipmap-anydpi-v26/ic_launcher*


          # ========================================================
          # PRODUCT FLAVOR DIRECTORIES
          # ========================================================

          echo "Creating flavor resource directories..."

          for FLAVOR in customer kitchen rider admin
          do

            mkdir -p android/app/src/$FLAVOR/res/values
            mkdir -p android/app/src/$FLAVOR/res/drawable

          done


          # ========================================================
          # APP NAMES
          # ========================================================

          echo "Creating flavor app names..."

          echo '<resources><string name="app_name">FB Delivery</string><string name="title_activity_main">FB Delivery</string></resources>' \
            > android/app/src/customer/res/values/strings.xml

          echo '<resources><string name="app_name">FB Kitchen</string><string name="title_activity_main">FB Kitchen</string></resources>' \
            > android/app/src/kitchen/res/values/strings.xml

          echo '<resources><string name="app_name">FB Rider</string><string name="title_activity_main">FB Rider</string></resources>' \
            > android/app/src/rider/res/values/strings.xml

          echo '<resources><string name="app_name">FB Manager</string><string name="title_activity_main">FB Manager</string></resources>' \
            > android/app/src/admin/res/values/strings.xml


          # ========================================================
          # SPLASH SCREEN FIX
          # ========================================================

          echo "Removing Capacitor splash logo..."


          # --------------------------------------------------------
          # Create transparent splash drawable
          # --------------------------------------------------------

          cat > android/app/src/main/res/drawable/transparent_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="1dp"
              android:height="1dp"
              android:viewportWidth="1"
              android:viewportHeight="1">

              <path
                  android:fillColor="@android:color/transparent"
                  android:pathData="M0,0h1v1h-1z" />

          </vector>
          EOF


          # --------------------------------------------------------
          # Find all styles/themes
          # --------------------------------------------------------

          STYLES_FILES=$(find android/ \
            -type f \
            \( -name "styles.xml" -o -name "themes.xml" \))


          # --------------------------------------------------------
          # Replace Capacitor / Android 12 splash icon
          # --------------------------------------------------------

          for SFILE in $STYLES_FILES
          do

            echo "Processing splash theme: $SFILE"


            # Replace Android 12 splash icon
            sed -i \
              's#android:windowSplashScreenAnimatedIcon="[^"]*"#android:windowSplashScreenAnimatedIcon="@drawable/transparent_splash"#g' \
              "$SFILE"


            sed -i \
              's#windowSplashScreenAnimatedIcon="[^"]*"#windowSplashScreenAnimatedIcon="@drawable/transparent_splash"#g' \
              "$SFILE"


            # Remove existing splash icon item and add transparent one
            sed -i \
              '/<item[^>]*windowSplashScreenAnimatedIcon[^>]*>/d' \
              "$SFILE"


            sed -i \
              '/<item[^>]*android:windowSplashScreenAnimatedIcon[^>]*>/d' \
              "$SFILE"


            # Change white splash background to dark
            sed -i 's/#ffffff/#09090b/g' "$SFILE"
            sed -i 's/#FFFFFF/#09090b/g' "$SFILE"

          done


          # ========================================================
          # COLORS
          # ========================================================

          COLORS_FILES=$(find android/ \
            -type f \
            -name "colors.xml")


          for CFILE in $COLORS_FILES
          do

            echo "Updating colors: $CFILE"

            sed -i 's/#ffffff/#09090b/g' "$CFILE"
            sed -i 's/#FFFFFF/#09090b/g' "$CFILE"

          done


          # ========================================================
          # CREATE TRANSPARENT SPLASH FOR FLAVORS TOO
          # ========================================================

          for FLAVOR in customer kitchen rider admin
          do

            cat > android/app/src/$FLAVOR/res/drawable/transparent_splash.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="1dp"
              android:height="1dp"
              android:viewportWidth="1"
              android:viewportHeight="1">

              <path
                  android:fillColor="@android:color/transparent"
                  android:pathData="M0,0h1v1h-1z" />

          </vector>
          EOF

          done


          # ========================================================
          # GENERATE APP ICONS
          # ========================================================

          echo "Installing Sharp..."

          npm install sharp


          node -e '

          const fs = require("fs");
          const path = require("path");
          const sharp = require("sharp");


          const apps = [
            "customer",
            "kitchen",
            "rider",
            "admin"
          ];


          const densities = {
            mdpi: 48,
            hdpi: 72,
            xhdpi: 96,
            xxhdpi: 144,
            xxxhdpi: 192
          };


          async function generateIcons() {

            for (const flavor of apps) {

              const svgPath =
                `src/assets/icons/${flavor}.svg`;


              if (!fs.existsSync(svgPath)) {

                console.error(
                  `SVG icon not found at ${svgPath}`
                );

                continue;

              }


              const svgContent =
                fs.readFileSync(svgPath, "utf8");


              for (const [dens, size] of Object.entries(densities)) {

                const dir =
                  `android/app/src/${flavor}/res/mipmap-${dens}`;


                fs.mkdirSync(
                  dir,
                  { recursive: true }
                );


                const buffer =
                  Buffer.from(svgContent);


                await sharp(buffer)
                  .resize(size, size)
                  .png()
                  .toFile(
                    path.join(
                      dir,
                      "ic_launcher.png"
                    )
                  );


                await sharp(buffer)
                  .resize(size, size)
                  .png()
                  .toFile(
                    path.join(
                      dir,
                      "ic_launcher_round.png"
                    )
                  );

              }

            }

          }


          generateIcons().catch((err) => {

            console.error(
              "Error generating icons:",
              err
            );

            process.exit(1);

          });

          '


          # ========================================================
          # GRADLE PRODUCT FLAVORS
          # ========================================================

          GRADLE_FILE="android/app/build.gradle"


          if [ -f "$GRADLE_FILE" ]; then

            echo "Injecting Product Flavors..."


            # ------------------------------------------------------
            # Flavor dimension
            # ------------------------------------------------------

            if ! grep -q "flavorDimensions" "$GRADLE_FILE"; then

              sed -i \
                '/defaultConfig {/i \    flavorDimensions "default"' \
                "$GRADLE_FILE"

            fi


            # ------------------------------------------------------
            # Product flavors
            # ------------------------------------------------------

            if ! grep -q "productFlavors" "$GRADLE_FILE"; then

              FLAVORS_BLOCK='    productFlavors {
        customer {
            dimension "default"
            applicationId "com.fastbite.customer.app"
            resValue "string", "app_name", "FB Delivery"
            resValue "string", "title_activity_main", "FB Delivery"
            manifestPlaceholders = [appName: "FB Delivery"]
        }

        kitchen {
            dimension "default"
            applicationId "com.fastbite.kitchen.kds"
            resValue "string", "app_name", "FB Kitchen"
            resValue "string", "title_activity_main", "FB Kitchen"
            manifestPlaceholders = [appName: "FB Kitchen"]
        }

        rider {
            dimension "default"
            applicationId "com.fastbite.rider.partner"
            resValue "string", "app_name", "FB Rider"
            resValue "string", "title_activity_main", "FB Rider"
            manifestPlaceholders = [appName: "FB Rider"]
        }

        admin {
            dimension "default"
            applicationId "com.fastbite.admin.manager"
            resValue "string", "app_name", "FB Manager"
            resValue "string", "title_activity_main", "FB Manager"
            manifestPlaceholders = [appName: "FB Manager"]
        }
    }'


              sed -i \
                "/buildTypes {/i $FLAVORS_BLOCK" \
                "$GRADLE_FILE"

            fi

          fi


      # ============================================================
      # BUILD ANDROID APK
      # ============================================================

      - name: Build Android APK with Gradle
        run: |

          # --------------------------------------------------------
          # Verify Android directory
          # --------------------------------------------------------

          if [ ! -d "android" ]; then

            echo "ERROR: Android directory does not exist."

            exit 1

          fi


          cd android


          # ========================================================
          # SETTINGS.GRADLE
          # ========================================================

          if [ ! -f "settings.gradle" ]; then

            echo "settings.gradle is missing. Creating default..."


            printf "include ':app'\n\
if (file('capacitor-cordova-android-plugins').exists()) {\n\
    include ':capacitor-cordova-android-plugins'\n\
    project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins')\n\
}\n\
def capacitorSettings = file('capacitor.settings.gradle')\n\
if (capacitorSettings.exists()) {\n\
    apply from: capacitorSettings\n\
}\n" > settings.gradle


          else

            if ! grep -q "capacitor-cordova-android-plugins" settings.gradle; then

              if [ -d "capacitor-cordova-android-plugins" ]; then

                echo "Adding capacitor-cordova-android-plugins..."

                printf "\n\
if (file('capacitor-cordova-android-plugins').exists()) {\n\
    include ':capacitor-cordova-android-plugins'\n\
    project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins')\n\
}\n" >> settings.gradle

              fi

            fi

          fi


          # ========================================================
          # VARIABLES.GRADLE
          # ========================================================

          if [ ! -f "variables.gradle" ]; then

            echo "variables.gradle is missing. Creating default..."


            printf "ext {\n\
    minSdkVersion = 22\n\
    compileSdkVersion = 36\n\
    targetSdkVersion = 35\n\
    androidxActivityVersion = '1.8.0'\n\
    androidxAppCompatVersion = '1.6.1'\n\
    androidxCoordinatorLayoutVersion = '1.2.0'\n\
    androidxCoreVersion = '1.12.0'\n\
    androidxFragmentVersion = '1.6.2'\n\
    coreSplashScreenVersion = '1.0.1'\n\
    androidxWebkitVersion = '1.9.0'\n\
    junitVersion = '4.13.2'\n\
    androidxJunitVersion = '1.1.5'\n\
    androidxEspressoCoreVersion = '3.5.1'\n\
    cordovaAndroidVersion = '10.1.1'\n\
}\n" > variables.gradle

          fi


          # ========================================================
          # SDK VERSION
          # ========================================================

          echo "Updating compileSdkVersion to 36..."


          find . \
            -name "*.gradle" \
            -exec sed -i \
            's/compileSdkVersion = .*/compileSdkVersion = 36/g' {} +


          find . \
            -name "*.gradle" \
            -exec sed -i \
            's/compileSdkVersion 35/compileSdkVersion 36/g' {} +


          find . \
            -name "*.gradle" \
            -exec sed -i \
            's/compileSdk 35/compileSdk 36/g' {} +


          find . \
            -name "*.gradle" \
            -exec sed -i \
            's/compileSdk = .*/compileSdk = 36/g' {} +


          # ========================================================
          # KOTLIN VERSION RESOLUTION
          # ========================================================

          if ! grep -q "resolutionStrategy" build.gradle; then

            echo "Adding Kotlin stdlib resolution strategy..."


            printf "\n\
allprojects {\n\
    configurations.all {\n\
        resolutionStrategy {\n\
            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'\n\
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'\n\
            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'\n\
        }\n\
    }\n\
}\n" >> build.gradle

          fi


          # ========================================================
          # GRADLE WRAPPER
          # ========================================================

          echo "Cleaning corrupted Gradle wrapper..."

          rm -rf gradle/wrapper/gradle-wrapper.jar


          echo "Generating Gradle wrapper..."

          gradle wrapper --gradle-version 8.13


          chmod +x gradlew


          # ========================================================
          # CLEAN + BUILD
          # ========================================================

          echo "Building all Debug APKs..."

          ./gradlew clean assembleDebug --stacktrace


      # ============================================================
      # UPLOAD APKs
      # ============================================================

      - name: Upload All APK Artifacts
        uses: actions/upload-artifact@v4

        with:

          name: FastBite-All-4-Flavor-APKs

          path: android/app/build/outputs/apk/*/debug/*.apk
