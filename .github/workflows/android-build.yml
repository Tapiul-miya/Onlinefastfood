name: FastBite Android Multi-Flavor Build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android Debug APKs for All Apps
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.13'

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Build Web Project
        run: npm run build

      - name: Add / Sync Capacitor Android
        run: |
          npm install -D @capacitor/cli
          npm install @capacitor/core @capacitor/android
          if [ ! -f "capacitor.config.ts" ] && [ ! -f "capacitor.config.json" ]; then
            echo "Initializing Capacitor..."
            npx cap init "FastBite Food Delivery" "com.fastbite.customer.app" --web-dir dist
          fi
          npx cap add android || true
          echo "Removing stale assets before sync..."
          rm -rf android/app/src/main/assets/public
          npx cap copy android
          npx cap sync android

          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            echo "Injecting Android permissions and Flavor Label into AndroidManifest.xml..."
            sed -i 's/android:label="@string\/app_name"/android:label="${appName}"/g' "$MANIFEST_FILE"
            sed -i 's/android:label="@string\/title_activity_main"/android:label="${appName}"/g' "$MANIFEST_FILE"
            
            for PERM in "INTERNET" "ACCESS_NETWORK_STATE" "ACCESS_FINE_LOCATION" "ACCESS_COARSE_LOCATION" "CALL_PHONE" "CAMERA" "VIBRATE" "POST_NOTIFICATIONS" "READ_EXTERNAL_STORAGE" "READ_MEDIA_IMAGES"; do
              if ! grep -q "android.permission.$PERM" "$MANIFEST_FILE"; then
                sed -i "/<application/i \    <uses-permission android:name=\"android.permission.$PERM\" \/>" "$MANIFEST_FILE"
              fi
            done
            echo "Permissions injected successfully!"
          fi

          # IMPORTANT: Remove default Capacitor launcher icons from src/main so flavor icons are used
          echo "Cleaning default Capacitor icons from src/main..."
          rm -rf android/app/src/main/res/mipmap-*/ic_launcher*

          # Setup Product Flavors Unique Names & Distinct Launcher Icons
          for FLAVOR in customer kitchen rider admin; do
            mkdir -p android/app/src/$FLAVOR/res/values
            mkdir -p android/app/src/$FLAVOR/res/drawable
            mkdir -p android/app/src/$FLAVOR/res/mipmap-anydpi-v26
            mkdir -p android/app/src/$FLAVOR/res/mipmap-hdpi
            mkdir -p android/app/src/$FLAVOR/res/mipmap-mdpi
            mkdir -p android/app/src/$FLAVOR/res/mipmap-xhdpi
            mkdir -p android/app/src/$FLAVOR/res/mipmap-xxhdpi
            mkdir -p android/app/src/$FLAVOR/res/mipmap-xxxhdpi
          done

          # 1. CUSTOMER APP (Orange Background #F97316 / Burger & Delivery Icon)
          printf '<resources><string name="app_name">FastBite Delivery</string><string name="title_activity_main">FastBite Delivery</string></resources>' > android/app/src/customer/res/values/strings.xml
          printf '<resources><color name="ic_launcher_background">#F97316</color></resources>' > android/app/src/customer/res/values/colors.xml
          printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FFFFFF" android:pathData="M34,46 C34,34 74,34 74,46 L34,46 Z M32,50 L76,50 C77,50 78,51 78,52 L78,54 C78,55 77,56 76,56 L32,56 C31,56 30,55 30,54 L30,52 C30,51 31,50 32,50 Z M34,60 L74,60 C74,68 34,68 34,60 Z"/></vector>' > android/app/src/customer/res/drawable/ic_launcher_foreground.xml

          # 2. KITCHEN KDS APP (Rose Red Background #E11D48 / Chef Hat & Pan Icon)
          printf '<resources><string name="app_name">FastBite Kitchen</string><string name="title_activity_main">FastBite Kitchen</string></resources>' > android/app/src/kitchen/res/values/strings.xml
          printf '<resources><color name="ic_launcher_background">#E11D48</color></resources>' > android/app/src/kitchen/res/values/colors.xml
          printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FFFFFF" android:pathData="M38,48 C32,43 34,33 44,34 C48,26 60,26 64,34 C74,33 76,43 70,48 L38,48 Z M38,52 L70,52 L68,66 L40,66 Z"/></vector>' > android/app/src/kitchen/res/drawable/ic_launcher_foreground.xml

          # 3. RIDER PARTNER APP (Emerald Green Background #10B981 / Delivery Scooter Icon)
          printf '<resources><string name="app_name">FastBite Rider</string><string name="title_activity_main">FastBite Rider</string></resources>' > android/app/src/rider/res/values/strings.xml
          printf '<resources><color name="ic_launcher_background">#10B981</color></resources>' > android/app/src/rider/res/values/colors.xml
          printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FFFFFF" android:pathData="M38,62 A6,6 0 1,1 38,50 A6,6 0 1,1 38,62 Z M70,62 A6,6 0 1,1 70,50 A6,6 0 1,1 70,62 Z M42,46 L56,46 L64,56 M54,36 L60,36 L56,46"/></vector>' > android/app/src/rider/res/drawable/ic_launcher_foreground.xml

          # 4. ADMIN MANAGER APP (Indigo Background #6366F1 / Super Manager Shield Icon)
          printf '<resources><string name="app_name">FastBite Manager</string><string name="title_activity_main">FastBite Manager</string></resources>' > android/app/src/admin/res/values/strings.xml
          printf '<resources><color name="ic_launcher_background">#6366F1</color></resources>' > android/app/src/admin/res/values/colors.xml
          printf '<vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108"><path android:fillColor="#FFFFFF" android:pathData="M54,30 L74,38 L74,54 C74,66 54,74 54,74 C54,74 34,66 34,54 L34,38 Z M54,40 L54,64 M44,50 L64,50"/></vector>' > android/app/src/admin/res/drawable/ic_launcher_foreground.xml

          # Apply Adaptive Icon XML (v26+) and Layer-List XML (legacy)
          ADAPTIVE_ICON='<?xml version="1.0" encoding="utf-8"?><adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>'
          LEGACY_ICON='<?xml version="1.0" encoding="utf-8"?><layer-list xmlns:android="http://schemas.android.com/apk/res/android"><item android:drawable="@color/ic_launcher_background"/><item android:drawable="@drawable/ic_launcher_foreground"/></layer-list>'

          for FLAVOR in customer kitchen rider admin; do
            printf "%s" "$ADAPTIVE_ICON" > android/app/src/$FLAVOR/res/mipmap-anydpi-v26/ic_launcher.xml
            printf "%s" "$ADAPTIVE_ICON" > android/app/src/$FLAVOR/res/mipmap-anydpi-v26/ic_launcher_round.xml
            for DENSITY in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
              printf "%s" "$LEGACY_ICON" > android/app/src/$FLAVOR/res/mipmap-$DENSITY/ic_launcher.xml
              printf "%s" "$LEGACY_ICON" > android/app/src/$FLAVOR/res/mipmap-$DENSITY/ic_launcher_round.xml
            done
          done

          GRADLE_FILE="android/app/build.gradle"
          if [ -f "$GRADLE_FILE" ]; then
            echo "Injecting Product Flavors into $GRADLE_FILE..."
            if ! grep -q "flavorDimensions" "$GRADLE_FILE"; then
              sed -i '/defaultConfig {/i \    flavorDimensions "default"' "$GRADLE_FILE"
            fi
            
            if ! grep -q "productFlavors" "$GRADLE_FILE"; then
              FLAVORS_BLOCK="    productFlavors {\n        customer {\n            dimension \"default\"\n            applicationId \"com.fastbite.customer.app\"\n            resValue \"string\", \"app_name\", \"FastBite Delivery\"\n            resValue \"string\", \"title_activity_main\", \"FastBite Delivery\"\n            manifestPlaceholders = [appName: \"FastBite Delivery\"]\n        }\n        kitchen {\n            dimension \"default\"\n            applicationId \"com.fastbite.kitchen.kds\"\n            resValue \"string\", \"app_name\", \"FastBite Kitchen\"\n            resValue \"string\", \"title_activity_main\", \"FastBite Kitchen\"]\n        }\n        rider {\n            dimension \"default\"\n            applicationId \"com.fastbite.rider.partner\"\n            resValue \"string\", \"app_name\", \"FastBite Rider\"\n            resValue \"string\", \"title_activity_main\", \"FastBite Rider\"\n            manifestPlaceholders = [appName: \"FastBite Rider\"]\n        }\n        admin {\n            dimension \"default\"\n            applicationId \"com.fastbite.admin.manager\"\n            resValue \"string\", \"app_name\", \"FastBite Manager\"\n            resValue \"string\", \"title_activity_main\", \"FastBite Manager\"\n            manifestPlaceholders = [appName: \"FastBite Manager\"]\n        }\n    }"
              sed -i "/buildTypes {/i $FLAVORS_BLOCK" "$GRADLE_FILE"
            fi
          fi

      - name: Build Android APK with Gradle
        run: |
          if [ ! -d "android" ]; then
            echo "Error: android directory does not exist. Capacitor add may have failed."
            exit 1
          fi
          cd android
          
          if [ ! -f "settings.gradle" ]; then
            echo "settings.gradle is missing. Creating default..."
            printf "include ':app'\nif (file('capacitor-cordova-android-plugins').exists()) {\n    include ':capacitor-cordova-android-plugins'\n    project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins')\n}\ndef capacitorSettings = file('capacitor.settings.gradle')\nif (capacitorSettings.exists()) {\n    apply from: capacitorSettings\n}\n" > settings.gradle
          else
            if ! grep -q "capacitor-cordova-android-plugins" settings.gradle; then
              if [ -d "capacitor-cordova-android-plugins" ]; then
                echo "Adding capacitor-cordova-android-plugins to settings.gradle..."
                printf "\nif (file('capacitor-cordova-android-plugins').exists()) {\n    include ':capacitor-cordova-android-plugins'\n    project(':capacitor-cordova-android-plugins').projectDir = new File('./capacitor-cordova-android-plugins')\n}\n" >> settings.gradle
              fi
            fi
          fi
          
          if [ ! -f "variables.gradle" ]; then
            echo "variables.gradle is missing. Creating default..."
            printf "ext {\n    minSdkVersion = 22\n    compileSdkVersion = 36\n    targetSdkVersion = 35\n    androidxActivityVersion = '1.8.0'\n    androidxAppCompatVersion = '1.6.1'\n    androidxCoordinatorLayoutVersion = '1.2.0'\n    androidxCoreVersion = '1.12.0'\n    androidxFragmentVersion = '1.6.2'\n    coreSplashScreenVersion = '1.0.1'\n    androidxWebkitVersion = '1.9.0'\n    junitVersion = '4.13.2'\n    androidxJunitVersion = '1.1.5'\n    androidxEspressoCoreVersion = '3.5.1'\n    cordovaAndroidVersion = '10.1.1'\n}\n" > variables.gradle
          fi
          
          echo "Updating compileSdkVersion and compileSdk to 36 in all Gradle configuration files..."
          find . -name "*.gradle" -exec sed -i 's/compileSdkVersion = .*/compileSdkVersion = 36/g' {} +
          find . -name "*.gradle" -exec sed -i 's/compileSdkVersion 35/compileSdkVersion 36/g' {} +
          find . -name "*.gradle" -exec sed -i 's/compileSdk 35/compileSdk 36/g' {} +
          find . -name "*.gradle" -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +
          
          if ! grep -q "resolutionStrategy" build.gradle; then
            echo "Adding Kotlin stdlib resolution strategy to build.gradle..."
            printf "\nallprojects {\n    configurations.all {\n        resolutionStrategy {\n            force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'\n            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'\n            force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'\n        }\n    }\n}\n" >> build.gradle
          fi
          
          echo "Cleaning corrupted Gradle wrapper..."
          rm -rf gradle/wrapper/gradle-wrapper.jar
          
          echo "Generating Gradle wrapper..."
          gradle wrapper --gradle-version 8.13
          
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Upload All APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FastBite-All-4-Flavor-APKs
          path: android/app/build/outputs/apk/*/debug/*.apk
